plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.RadhaMounika'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
	compileOnly 'org.projectlombok:lombok:1.18.38'
	//above 2 for required args consturctor
	implementation 'org.python:jython-standalone:2.7.2'
	implementation 'mysql:mysql-connector-java:8.0.33'//err to create entity manager
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'//to extend in repository

}

tasks.named('test') {
	useJUnitPlatform()
}
