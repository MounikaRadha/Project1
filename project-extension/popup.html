<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Title</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f4;
      width: 300px;
    }

    h1 {
      color: #333;
    }

    #passwordDiv {
      margin-top: 20px;
    }

    input {
      padding: 10px;
      width: 90%;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #successDiv {
      display: none;
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <h1>Protect your site</h1>
  <p>Hi there</p>
  <div id="passwordDiv">
    <input type="text" placeholder="Enter password to protect your site" id="passwordField" />
    <button id="submitPassword">Save Password</button>
  </div>
  <div id="successDiv">Password saved successfully</div>
  <div id="alreadyProtected" style="display:none;">already site is protected</div>
  <script src="./scripts/popup.js"></script>
</body>

</html>
